owner: "UBC FRESH / CLEWs-C2070 forestry data maintainers"
notes:
  - "Curated registry for datasets accepted into the CLEWs-C2070 FRESH data foundation."
  - "Candidate discovery starts in metadata/source-inventory.csv."
  - "Promote a source here only after publisher, license, access mode, coverage, and modelling use have been reviewed."
  - "Large payloads belong in the DataLad-backed data submodule, not in the parent repository."

