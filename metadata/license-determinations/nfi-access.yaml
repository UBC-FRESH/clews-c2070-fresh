    license_summary: "Open Government Licence - Canada. Permits commercial and non-commercial use, reproduction, and redistribution with attribution. Source must be acknowledged."
    model_use: permitted
    redistribution: permitted
    validation_use: permitted
    dua_required: false
    acquisition:
      archive_date: "2026-11-14"
      local_path: "data/raw/magplot/"
      package_sha256: "270055bb9eeed6ccd6cbd75f6a2026b54e340c5a4938af18ad06e479792888db"
      package_bytes: 127123248
      sites: 39130
      remeasured_sites: 20890
      plot_visits: 257031
      tree_measurements: 7771041
      tracked_trees: 2866168
      remeasured_tracked_trees: 1573761
      species_codes: 140
      year_min: 1921
      year_max: 2024
      coverage_note: "Open Tier-1 package: BC, QC, NB, NL, YT, NT, SK, MB only; no AB, ON, PE or NS."
    status: acquired/archived
    notes:
      - "MAGPlot provides a harmonized alternative if NFI ground plot DUA is delayed."
      - "2026-11-14: acquired and archived at data/raw/magplot/. The open Tier-1 package contains BC_FAIBGP, QC_PSP, NB_CLI, NL_PSP, YT_PSP and NFM_GP; there are no AB, ON, PE or NS records."
      - "Schema standardization enables direct use in calibration workflows; 1,573,761 tracked trees have repeat measurements."
      - "Limitations: published coordinates are approximate (+/-10 km); 1,027 BC sites have no coordinates; v1.2 has no age/site-index/soil tables; variable-radius BC plots lack BAF/plot area."
      - "Verify version currency; MAGPlot updates may lag provincial PSP refreshes."

