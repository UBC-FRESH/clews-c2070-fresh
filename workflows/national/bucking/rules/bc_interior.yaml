# BC interior dimension sorts for the national bucking contract.
#
# Source: TIPSY 4.5, Log Grades, industrial, interior (public CHM page
# `TIPSY_no_econ/Log_Grades_industrial_interior.htm`,
# sha256 73f3f7954727e30cdbeb2d8f899b13a9d1e4c069db9dce8e7d0aa02e890afdbd;
# extracted table checked in beside this file as
# `tipsy45_industrial_sorts.csv`,
# sha256 a560aa428fad5692856522419fc984f1c404303e8999134a3b318dc2de98d4fb).
# These are geometry/dimension-based sorts, NOT official BC log grades.  Defect,
# sweep, knot, rot, and product-quality rules are not represented.
#
# Phase 0 bucking uses min_top_cm and min_length_m only.  max_length_m and
# trim_m are contract bounds: the reference bucker selects by minimum length
# and does not apply a trim allowance.  No log may exceed max_length_m.
#
# `tipsy_group` records the published TIPSY processing group.  `product` and
# `price_key` remain the repository price classes: Chip'n'saw and Large/Small
# Gang sawlogs are priced in the sawlog class because the public price deck
# does not publish separate prices for those TIPSY groups.
#
# TIPSY publishes "--" (no sort-specific minimum length) for the deciduous
# sorts.  TIPSY 4.5 Log Tables state that scaled logs are 2.5 m (8 ft) or
# longer, so 2.5 m is the documented base floor for those sorts.
jurisdiction: BC
authority: "TIPSY 4.5, Log Grades, industrial, interior (public documentation)"
version: "2026-11-23"
basis: dimension_only
grade_status: not_assigned
note: >
  Sawlog/Peeler, Large Gang, Small Gang, Chip'n'saw, Pulp, and deciduous
  sorts.  Conifer rules apply to the SPF, Df-Larch, Hem-Bal, Cedar, White
  Pine, and Yellow Pine market groups.  Deciduous rules apply to the
  Deciduous market group.  Deciduous sort minima are not published; the
  documented 2.5 m TIPSY base log length is used as the geometry floor.

sorts:
