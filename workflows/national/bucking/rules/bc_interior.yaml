# BC interior dimension sorts for the national bucking contract.
#
# Source: TIPSY 4.5 industrial interior log dimensions (public documentation),
# adapted from nemora config/log_sorts/tipsy_interior.yaml.  These are
# geometry/dimension-based sorts, NOT official BC log grades.  Defect, sweep,
# knot, rot, and product-quality rules are not represented.
#
# Phase 0 bucking uses min_top_cm and min_length_m only.  max_length_m and
# trim_m are contract bounds: the reference bucker selects by minimum length
# and does not apply a trim allowance.  No log may exceed max_length_m.
jurisdiction: BC
authority: "TIPSY 4.5, Log Grades, industrial, interior (public documentation)"
version: "2026-11-15"
basis: dimension_only
grade_status: not_assigned
note: >
  Sawlog, pulpwood, and deciduous other sorts.  Conifer rules apply to the
  SPF, Df-Larch, Hem-Bal, Cedar, White Pine, and Yellow Pine market groups.
  Deciduous rules apply to the Deciduous market group.

sorts:
