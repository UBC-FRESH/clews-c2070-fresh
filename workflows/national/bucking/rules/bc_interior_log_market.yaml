# BC interior dimension sorts with a published BC log-market product surface.
#
# Geometry source: TIPSY 4.5, Log Grades, industrial, interior (public CHM page
# `TIPSY_no_econ/Log_Grades_industrial_interior.htm`), extracted table
# `tipsy45_industrial_sorts.csv`.  The geometry is identical to
# `bc_interior.yaml`; only the product/price_key assignment changes for the
# market-surface scenario.
#
# Product mapping source: BC Interior Log Market Report species x end-use
# averages in `data/derived/national/harvest_basis/bc_log_market/`.  TIPSY
# sort groups map to published end uses as follows:
#
#   Sawlog/Peeler, Large Gang, Small Gang, Chip'n'saw -> sawlog
#   Pulp                                                -> pulpwood
#   Deciduous Sawlog/Peeler                             -> sawlog
#   Deciduous Pulp                                      -> pulpwood
#
# Peeler prices are not assigned: peeler quality is not represented by the
# dimension bucker.  Coast grade letters are not mapped: no coast-grade to
# TIPSY-sort crosswalk is documented.  Missing species x product cells are
# gaps, not substituted values.
#
# These are dimension-based sorts, NOT official BC log grades.  Defect, sweep,
# knot, rot, and product-quality rules are not represented.
#
# `max_length_m` and `trim_m` remain contract bounds: the reference bucker
# selects by minimum length and does not apply a trim allowance.  No log may
# exceed max_length_m.
jurisdiction: BC
authority: "TIPSY 4.5 industrial interior dimensions + BC log-market product mapping"
version: "2026-11-23-bc-log-market-surface-v1"
basis: dimension_only
grade_status: not_assigned
note: >
  Sawlog/Peeler, Large Gang, Small Gang, Chip'n'saw, Pulp, and deciduous
  sorts.  Conifer rules apply to the SPF, Df-Larch, Hem-Bal, Cedar, White
  Pine, and Yellow Pine market groups.  Deciduous rules apply to the Deciduous
  market group.  Deciduous sort minima are not published; the documented
  2.5 m TIPSY base log length is used as the geometry floor.

sorts:
  - {species_class: conifer, sort_code: D38L13, product: sawlog, min_top_cm: 38.0, min_length_m: 13.0, max_length_m: 13.0, trim_m: 0.0, priority: 1, price_key: sawlog, tipsy_group: "Sawlog/Peeler"}
